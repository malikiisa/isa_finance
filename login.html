<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - FinTrack</title>
    <!-- Fonts and Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet"/>
    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        "surface": "#f8f9ff",
                        "surface-container-lowest": "#ffffff",
                        "surface-container-low": "#eff4ff",
                        "surface-container": "#e5eeff",
                        "on-surface": "#0b1c30",
                        "on-surface-variant": "#45464d",
                        "primary": "#000000",
                        "secondary": "#006c49",
                        "secondary-container": "#6cf8bb",
                        "error": "#ba1a1a",
                        "outline": "#76777d"
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Plus Jakarta Sans', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <script>
        // Inisialisasi tema
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
</head>
<body class="bg-surface dark:bg-slate-900 text-on-surface dark:text-slate-100 antialiased min-h-screen flex flex-col items-center justify-center p-4 transition-colors duration-300">

    <!-- Card Login -->
    <div class="w-full max-w-md bg-surface-container-lowest dark:bg-slate-800 rounded-2xl shadow-xl border border-outline/10 dark:border-slate-700 p-8 transition-colors duration-300">
        
        <!-- Header / Logo -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-secondary/10 dark:bg-secondary/20 mb-3 text-secondary">
                <span class="material-symbols-outlined text-3xl">account_balance_wallet</span>
            </div>
            <h1 class="font-heading text-2xl font-bold text-on-surface dark:text-slate-100">FinTrack</h1>
            <p class="text-sm text-on-surface-variant dark:text-slate-400 mt-1">Masuk ke akun Anda</p>
        </div>

        <!-- Alert Error -->
        <div id="login-error" class="hidden items-center gap-2 p-3 mb-5 text-xs font-medium rounded-xl bg-error/10 border border-error/20 text-error">
            <span class="material-symbols-outlined text-base shrink-0">error</span>
            <span id="login-error-text">Username atau password salah.</span>
        </div>

        <!-- Form Login -->
        <form onsubmit="handleLogin(event)" class="space-y-5">
            <!-- Username Input -->
            <div>
                <label for="login-username" class="block text-xs font-semibold uppercase tracking-wider text-on-surface-variant dark:text-slate-300 mb-1.5">Username</label>
                <div class="relative flex items-center">
                    <span class="material-symbols-outlined absolute left-3.5 text-outline dark:text-slate-400 text-lg pointer-events-none">person</span>
                    <input 
                        type="text" 
                        id="login-username" 
                        name="username"
                        required 
                        autocomplete="username"
                        placeholder="Masukkan username" 
                        class="w-full pl-10 pr-4 py-2.5 bg-surface-container-low dark:bg-slate-700/60 border border-outline/20 dark:border-slate-600 rounded-xl text-sm text-on-surface dark:text-slate-100 placeholder-outline/60 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-secondary/50 focus:border-secondary transition-all"
                    >
                </div>
            </div>

            <!-- Password Input -->
            <div>
                <label for="login-password" class="block text-xs font-semibold uppercase tracking-wider text-on-surface-variant dark:text-slate-300 mb-1.5">Password</label>
                <div class="relative flex items-center">
                    <span class="material-symbols-outlined absolute left-3.5 text-outline dark:text-slate-400 text-lg pointer-events-none">lock</span>
                    <input 
                        type="password" 
                        id="login-password" 
                        name="password"
                        required 
                        autocomplete="current-password"
                        placeholder="Masukkan password" 
                        class="w-full pl-10 pr-11 py-2.5 bg-surface-container-low dark:bg-slate-700/60 border border-outline/20 dark:border-slate-600 rounded-xl text-sm text-on-surface dark:text-slate-100 placeholder-outline/60 dark:placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-secondary/50 focus:border-secondary transition-all"
                    >
                    <button 
                        type="button" 
                        onclick="togglePasswordVisibility()" 
                        class="absolute right-3 p-1 text-outline dark:text-slate-400 hover:text-on-surface dark:hover:text-slate-200 transition-colors"
                        title="Tampilkan / Sembunyikan Password"
                        aria-label="Tampilkan / Sembunyikan Password"
                    >
                        <span id="toggle-password-icon" class="material-symbols-outlined text-lg">visibility</span>
                    </button>
                </div>
            </div>

            <!-- Submit Button -->
            <button 
                type="submit" 
                class="w-full py-3 px-4 mt-2 bg-secondary text-white font-medium text-sm rounded-xl shadow-md hover:opacity-95 active:scale-[0.99] transition-all flex items-center justify-center gap-2 cursor-pointer"
            >
                <span>Masuk</span>
                <span class="material-symbols-outlined text-base">login</span>
            </button>
        </form>
    </div>

    <!-- Footer -->
    <footer class="mt-8 text-center text-xs text-on-surface-variant dark:text-slate-500">
        &copy; 2026 FinTrack. Pencatatan Keuangan Pribadi.
    </footer>

    <!-- Auth Logic -->
    <script src="auth.js"></script>
</body>
</html>
